<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <main class="container">

        <div class="form-card">

            <header class="form-header">
                <h1>Student Registration</h1>
                <p>Register your details to join StudentHub Portal</p>
            </header>

            <!-- Success message -->
            <div id="successMessage" class="success-message" role="alert">
                Registration successful!
            </div>

            <form id="registrationForm" novalidate>

                <!-- NAME -->
                <div class="form-group">
                    <label for="name">Full Name <span>*</span></label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <small id="nameError" class="error"></small>
                </div>


                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email Address <span>*</span></label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >

                    <small id="emailError" class="error"></small>
                </div>


                <!-- MOBILE -->
                <div class="form-group">
                    <label for="mobile">Mobile Number <span>*</span></label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                    <small id="mobileError" class="error"></small>
                </div>


                <!-- PASSWORD -->
                <div class="form-group">
                    <label for="password">Password <span>*</span></label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <!-- Password strength -->
                    <div class="strength-container">
                        <div id="strengthBar" class="strength-bar"></div>
                    </div>

                    <p id="strengthText" class="strength-text">
                        Password strength: Not entered
                    </p>

                    <small id="passwordError" class="error"></small>
                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                    <small id="confirmPasswordError" class="error"></small>
                </div>


                <!-- COURSE -->
                <div class="form-group">
                    <label for="course">Course <span>*</span></label>

                    <select id="course" name="course" required>
                        <option value="">-- Select Course --</option>
                        <option value="Computer Engineering">
                            Computer Engineering
                        </option>
                        <option value="Information Technology">
                            Information Technology
                        </option>
                        <option value="Electronics Engineering">
                            Electronics Engineering
                        </option>
                        <option value="Mechanical Engineering">
                            Mechanical Engineering
                        </option>
                        <option value="Civil Engineering">
                            Civil Engineering
                        </option>
                    </select>

                    <small id="courseError" class="error"></small>
                </div>


                <!-- YEAR -->
                <div class="form-group">
                    <label for="year">Year <span>*</span></label>

                    <select id="year" name="year" required>
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>

                    <small id="yearError" class="error"></small>
                </div>


                <!-- GENDER -->
                <fieldset class="form-group gender-group">

                    <legend>Gender <span>*</span></legend>

                    <div class="radio-options">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small id="genderError" class="error"></small>

                </fieldset>


                <!-- TERMS -->
                <div class="terms-group">

                    <label class="terms-label">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <span>
                            I agree to the
                            <a href="#" onclick="return false;">
                                Terms and Conditions
                            </a>
                        </span>

                    </label>

                    <small id="termsError" class="error"></small>

                </div>


                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">
                    Register
                </button>

                <!-- RESET -->
                <button type="reset" class="reset-btn">
                    Reset Form
                </button>

            </form>

        </div>

    </main>

    <script src="form.js"></script>

</body>
</html>
